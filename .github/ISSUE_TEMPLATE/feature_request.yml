name: Feature request
description: An idea that would make the morning paper better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to change
      description: The problem you hit, or what you wish the paper did.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
